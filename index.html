<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vpn_logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>%VITE_SEO_TITLE%</title>
    <meta name="description" content="%VITE_SEO_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_APP_NAME%" />
    <meta property="og:url" content="https://%VITE_PUBLIC_HOST%/" />
    <meta property="og:title" content="%VITE_SEO_TITLE%" />
    <meta property="og:description" content="%VITE_SEO_DESCRIPTION%" />
    <meta property="og:image" content="%VITE_SEO_IMAGE%" />
    <meta property="og:image:alt" content="%VITE_SEO_TITLE%" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_SEO_TITLE%" />
    <meta name="twitter:description" content="%VITE_SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_SEO_IMAGE%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      // Load Telegram Web App script only inside Telegram environment
      (function () {
        var isTelegram =
          window.TelegramWebviewProxy ||
          location.hash.indexOf('tgWebApp') !== -1 ||
          location.search.indexOf('tgWebApp') !== -1;
        if (isTelegram) {
          var s = document.createElement('script');
          s.src = 'https://telegram.org/js/telegram-web-app.js';
          s.async = true;
          document.head.appendChild(s);
        }
      })();
    </script>
    <style>
      body {
        background-color: #0a0f1a;
      }
    </style>
    <script>
      // The React error boundary cannot handle failures that happen before the
      // entry module starts. Recover once from a stalled/failed module load,
      // then show a useful fallback instead of leaving an empty dark page.
      (function () {
        var retryKey = 'cabinet_boot_retry_ts';
        var retryParam = '__boot_retry';
        var fallbackShown = false;

        function cleanRetryParam() {
          try {
            var url = new URL(window.location.href);
            if (url.searchParams.has(retryParam)) {
              url.searchParams.delete(retryParam);
              window.history.replaceState(window.history.state, '', url.toString());
            }
          } catch (_) {}
        }

        function recoverBoot() {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length > 0 || fallbackShown) return;

          var now = Date.now();
          var lastRetry = 0;
          try {
            lastRetry = Number(sessionStorage.getItem(retryKey) || '0');
          } catch (_) {}

          if (now - lastRetry > 60000) {
            try {
              sessionStorage.setItem(retryKey, String(now));
              var retryUrl = new URL(window.location.href);
              retryUrl.searchParams.set(retryParam, String(now));
              window.location.replace(retryUrl.toString());
              return;
            } catch (_) {
              window.location.reload();
              return;
            }
          }

          fallbackShown = true;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;color:#e5e7eb;font-family:system-ui,sans-serif">' +
            '<div style="max-width:420px;text-align:center">' +
            '<div style="font-size:36px;margin-bottom:16px">⚠️</div>' +
            '<h1 style="font-size:20px;margin:0 0 10px">Не удалось загрузить кабинет</h1>' +
            '<p style="color:#9ca3af;line-height:1.5;margin:0 0 20px">Проверьте соединение и попробуйте ещё раз.</p>' +
            '<button type="button" onclick="window.location.reload()" style="border:0;border-radius:12px;background:#0ea5e9;color:white;padding:12px 22px;font-size:15px;cursor:pointer">Повторить</button>' +
            '</div></div>';
        }

        window.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          if (!root) return;

          var observer = new MutationObserver(function () {
            if (!fallbackShown && root.childNodes.length > 0) {
              observer.disconnect();
              try {
                sessionStorage.removeItem(retryKey);
              } catch (_) {}
              cleanRetryParam();
            }
          });
          observer.observe(root, { childList: true });
          window.setTimeout(recoverBoot, 8000);
        });

        window.addEventListener('vite:preloadError', function (event) {
          event.preventDefault();
          window.setTimeout(recoverBoot, 0);
        });

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            var isAppAsset =
              target &&
              (target.tagName === 'SCRIPT' ||
                (target.tagName === 'LINK' && target.href.indexOf('/assets/') !== -1));
            if (isAppAsset) {
              window.setTimeout(recoverBoot, 0);
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="max-width: 640px; margin: 48px auto; padding: 0 24px; color: #e5e7eb; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1 style="font-size: 22px; margin: 0 0 12px">%VITE_SEO_TITLE%</h1>
        <p style="margin: 0 0 16px; color: #9ca3af">%VITE_SEO_DESCRIPTION%</p>
        <p style="margin: 0">
          <a href="/home" style="color: #60a5fa">/home</a> ·
          <a href="/login" style="color: #60a5fa">/login</a>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
